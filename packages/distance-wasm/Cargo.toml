[package]
name = "distance-wasm"
version = "0.0.8"
authors = ["Demo Macro <abc@imst.xyz>"]
edition = "2021"
description = "WebAssembly bindings for high-performance string distance and similarity algorithms"
keywords = ["distance", "similarity", "algorithms", "levenshtein", "fuzzy"]
license = "MIT"
repository = "https://github.com/DemoMacro/nlptools"
homepage = "https://github.com/DemoMacro/nlptools#readme"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2.84"
console_error_panic_hook = { version = "0.1.7", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3.34"

[profile.release]
opt-level = 3
lto = true
